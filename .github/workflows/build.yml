name: APK bauen

# Läuft bei jedem Hochladen auf main und lässt sich auch von Hand starten.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Ausführbar machen (nötig, wenn die Datei unter Windows angelegt wurde)
        run: chmod +x gradlew

      - name: Test-APK bauen
        run: ./gradlew assembleDebug

      - name: APK zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: GartenManager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
